name: Check listings

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
    paths: ["listings.json", "README.md", "scripts/**", "ignored.json", "watchlist.json", "tests/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate listings.json and confirm README.md is regenerated
        run: python3 scripts/update_readme.py --check
      - name: Run unit tests
        run: python3 -m unittest discover tests
      - name: Verify changed rows against their postings
        if: github.event_name == 'pull_request'
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: python3 scripts/validate_listings.py --base origin/${{ github.base_ref }} --labels="$LABELS"
