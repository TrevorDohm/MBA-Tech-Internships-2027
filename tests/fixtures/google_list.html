<html><body><script>[["110899190426411718","MBA Intern, 2027","https://www.google.com/about/careers/applications/signin?jobId\u003dCiUAL2Fckas-hobIHKt_RlM9bMmdAY1Egmm_0W7hQZ0dRyaC4fykEjsA9yzvgtbDUGmQsX1TC-jQ7fUkxKk3oBHJD9xMGS-qG5p7ER7Ur7Nk4lv3r_Vb8OOqIbtd7E4pGPnl9A%3D%3D_V2\u0026loc\u003dHK\u0026title\u003dMBA+Intern",[null,"\u003cul\u003e\n\u003cli\u003eIntern projects will be determined based on the experience, skills and interests of the student. If you are interested in a particular area, please make sure to include it in your resume.\u003c/li\u003e\n\u003c/ul\u003e"],[null,"\u003ch3\u003eMinimum qualifications:\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003eCurrently enrolled in a MBA program.\u003c/li\u003e\n\u003c/ul\u003e\u003cbr\u003e\u003ch3\u003ePreferred qualifications:\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003eExperience prior to the MBA program in sales, advertising, consulting, analysis, customer service, marketing, finance, technical sales and operations, or related fields.\u003c/li\u003e\n\u003cli\u003eAbility to complete a 10-12 week internship at the assigned office in summer 2027 and to return to a MBA degree program after completion of the internship.\u003c/li\u003e\n\u003cli\u003eAbility to take initiative and be an independent thinker.\u003cbr\u003eExcellent problem-solving skills, with the ability to manage strategic and challenging business problems.\u003c/li\u003e\n\u003cli\u003eExcellent project management and organizational skills, with the ability to drive and implement ideas in a changing environment.\u003c/li\u003e\n\u003cli\u003e\u003cdiv\u003e\u003cdiv\u003e\u003cdiv\u003eInterest in the internet and Google's technology and Ads business.\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/li\u003e\n\u003c/ul\u003e"],"projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc",null,"Google","en-US",[["Hong Kong",["Hong Kong"],null,null,null,"HK"]],[null,"\u003cp\u003eOur MBA interns work on projects that take on some of the most cutting-edge business challenges in the high-tech industry. Here are a few teams that our graduate interns have joined across the business:\u003cbr\u003e- Business Strategy\u003cbr\u003e- Finance\u003cbr\u003e- Marketing\u003cbr\u003e- Operations \u0026amp; Support\u003cbr\u003e- People Operations\u003cbr\u003e- Product Management\u003cbr\u003e- Sales\u003cbr\u003e- Technical Solutions\u003c/p\u003e\u003cp\u003eWant to change the world? Or are you thinking even bigger? At Google, you'll find big problems, and plenty of opportunities to make a real difference in the world. Google employs MBA and graduate students, globally, in areas ranging from product management and sales to finance, operations, and human resources - and everything in between.\u003cbr\u003e\u003cbr\u003eInternships for MBA and other business-focused graduate students are 10-12 weeks long and are offered in a range of functions across the company. For internships, we hire first into job families and then work with successful candidates to find project groups that match their skills and interests.\u003c/p\u003e"],[3],[1792050149,994000000],[1792050149,994000000],[1792050150,62000000],[null,"To be eligible for this program, candidates must be available to work full-time for 10-12 weeks during 2027 summer.\u003cbr\u003e\u003cbr\u003eApplicants will be reviewed on a rolling basis and it is encouraged to apply early. The anticipated application window is open until November 15, but may close earlier if all available projects are full. Applications submitted after the application window or once role is closed/projects are full will not be considered.\u003cbr\u003e\u003cbr\u003eGoogle is a global company and, in order to facilitate efficient collaboration and communication globally, English proficiency is a requirement for this internship program.\u003cbr\u003e\u003cbr\u003eTo start the application process, you will need an updated CV or resume and a current unofficial or official transcript in English. Click on the “Apply” button on this page and provide the required materials in the appropriate sections (PDFs preferred):\u003cbr\u003e1. In the “Resume Section:” attach an updated CV or resume.\u003cbr\u003e2. In the “Education Section:” attach a current or recent unofficial or official transcript in English.\u003cbr\u003eUnder “Degree Status,” select “Now attending” to upload a transcript."],null,null,[null,""],[null,"\u003cul\u003e\n\u003cli\u003eCurrently enrolled in a MBA program.\u003c/li\u003e\n\u003c/ul\u003e"],5],["121103710599160518","MBA Intern, Summer 2027","https://www.google.com/about/careers/applications/signin?jobId\u003dCiUAL2FckVq5gymvZEIMKp_jyFKrUSW7gakRzYi9XTmL7Eyx12CzEjsA9yzvgoP5vDL2XNcTMsBWBLkWu3qkWZ-GM87UU0E8uWV9Yz9I2cRx3cWVoDf2CCrFSOvvEp3sFJCzjQ%3D%3D_V2\u0026loc\u003dUS\u0026title\u003dMBA+Intern",[null,"\u003cul\u003e\n\u003cli\u003e\u003cp dir\u003d\"ltr\"\u003eGoogle interns are given a lot of responsibility and the opportunity to give a meaningful contribution to their teams. Specific responsibilities are assigned to interns at the start of the program.\u003c/p\u003e\u003c/li\u003e\n\u003c/ul\u003e"],[null,"\u003ch3\u003eMinimum qualifications:\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003eCurrently enrolled in a full-time Master of Business Administration program.\u003c/li\u003e\n\u003c/ul\u003e\u003cbr\u003e\u003ch3\u003ePreferred qualifications:\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003e\u003cdiv\u003eIn your first year of an MBA program and returning to a full-time MBA program after completion of the internship with at least one semester remaining in the program.\u003c/div\u003e\u003c/li\u003e\n\u003cli\u003eCurrently attending an MBA program in the US and available to complete a full-time, consecutive 12-week internship between May and September 2027.\u003c/li\u003e\n\u003cli\u003eExcellent project management, people management and organizational skills, with the ability to manage and implement ideas in a changing environment.\u003c/li\u003e\n\u003cli\u003eExcellent problem-solving skills, and ability to solve strategic and difficult business problems.\u003c/li\u003e\n\u003cli\u003eInterest in the technology industry and Google’s business.\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eAI Fluency\u003c/li\u003e\n\u003c/ul\u003e"],"projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc",null,"Google","en-US",[["Mountain View, CA, USA",["100 Bay Vw Dr, Mountain View, CA 94043, USA"],"Mountain View","94043","CA","US"],["Atlanta, GA, USA",["Atlanta, GA, USA"],"Atlanta",null,"GA","US"],["Austin, TX, USA",["Austin, TX, USA"],"Austin",null,"TX","US"],["Boulder, CO, USA",["Boulder, CO, USA"],"Boulder",null,"CO","US"],["Chicago, IL, USA",["Chicago, IL, USA"],"Chicago",null,"IL","US"],["Kirkland, WA, USA",["Kirkland, WA, USA"],"Kirkland",null,"WA","US"],["New York, NY, USA",["New York, NY, USA"],"New York",null,"NY","US"],["San Bruno, CA, USA",["San Bruno, CA, USA"],"San Bruno",null,"CA","US"],["Seattle, WA, USA",["Seattle, WA, USA"],"Seattle",null,"WA","US"],["San Francisco, CA, USA",["San Francisco, CA, USA"],"San Francisco",null,"CA","US"],["Sunnyvale, CA, USA",["Sunnyvale, CA, USA"],"Sunnyvale",null,"CA","US"],["Washington D.C., DC, USA",["Washington, DC, USA"],"Washington",null,"DC","US"]],[null,"\u003cp\u003e*This internship program is intended for students that are pursuing a Master’s in Business Administration in year one of the program, depending on their program and unique circumstances.\u003c/p\u003e\u003cp\u003eOur MBA Internship Program is a paid internship that will immerse you into the tech industry on a high-impact team. You’ll enhance your skill set, be challenged with rigorous work, grow your network and drive meaningful change in our business. \u003c/p\u003e\u003cp\u003eOutside of your core work, you will participate in a high-touch program that exposes you to Google’s business operations, connects you with interns and Googlers, and invests in your personal and professional development. You may pick up a new technical skill, while also building a relationship with a 1:1 mentor and hearing from company leadership through a unique speaker series.\u003c/p\u003e\u003cp\u003eInterns will be considered for potential full-time opportunities in their host organizations based on their internship performance and business need.\u003c/p\u003e\u003cp\u003eRole Areas:\u003c/p\u003e\u003cp\u003eMBA interns are placed on teams across the business according to their background and skills. To explore our primary \u003ca href\u003d\"https://www.google.com/intl/es/about/careers/fields-of-work/\" target\u003d\"_blank\"\u003efields of work\u003c/a\u003e and review common participating teams, please visit our \u003ca href\u003d\"https://rsvp.withgoogle.com/events/google-student-hub/roles\" target\u003d\"_blank\"\u003eStudent Hub page\u003c/a\u003e. While participating hiring teams vary each year, the key role profiles typically included are outlined below: \u003c/p\u003e\u003cp\u003eBusiness Strategy \u0026amp; Operations: Deliver the analytical insights our leaders use to enable us to innovate. Whether it’s identifying acquisitions and investments, generating business strategies for products, or developing partners in emerging markets such as Africa and India, Business Strategy Googlers anticipate opportunities and execute programs critical to Google’s short- and long-term growth.\u003c/p\u003e\u003cp\u003eFinance: Fuel our moonshots by devising innovative solutions to complex problems in forecasting, accounting, compliance, and project management. From advising our product teams to managing day-to-day balance sheets, you’ll help keep our business on track to meet (or, better yet, exceed) our goals.\u003c/p\u003e\u003cp\u003ePeople Operations: Empowering the people who are building the future of AI. Our People Operations team are the strategists and culture-builders who ensure our colleagues can thrive in an AI-powered world. By blending data-driven strategy with a deep focus on the employee experience, we are dedicated to building an extraordinary workplace, designing the future of work, and supporting Google's AI-powered transformation. We’re not just an HR team; we are the architects of the culture that will lead Google's next chapter.\u003c/p\u003e\u003cp\u003eProgram Management: Overseeing day-to-day progress on large-scale projects, owning planning, execution, and communications, Program Managers play a critical role across various product areas and functions across Google, from Cloud to Platform \u0026amp; Devices, and beyond.\u003c/p\u003e\u003cp\u003eProduct Management: You’re a curious and collaborative visionary, someone excited about solving the hard problems in technology. Google is and always will be a company that thinks big and takes risks. Architect the future of our products by bridging engineering and business as you manage a product's full lifecycle, from strategic planning to development and launch. Computer science and coding experience required in order to be considered.\u003c/p\u003e\u003cp\u003eSales, Service \u0026amp; Support: Turn product innovations into vital client solutions. The backbone of Google’s success, the account managers, consultants and analysts in these roles are all dedicated to top-notch client service. Whether negotiating with Fortune 500 companies, solving technical challenges for small businesses, or surfacing product ads in just the right place, we develop new business opportunities while increasing the use of our product offerings.\u003c/p\u003e\u003cp\u003eCorporate Development: You work collaboratively across functions to identify, evaluate, and negotiate both acquisition and strategic investment opportunities. You understand the industry landscape and regional nuances, and provide the management team with the needed insight to drive intelligent, sound decision-making. \u003c/p\u003e\u003cp\u003eGoogle Public Sector: You'll partner with government and education to drive innovation, enhance security, and implement cutting-edge cloud and AI solutions. From enhancing citizen services to protecting national security, you’ll build impactful solutions that make a difference in millions of lives. \u003c/p\u003e\u003cbr\u003e\u003cdiv\u003eIndividual pay is determined by factors including job-related skills, experience, and relevant education or training.\u003c/div\u003e\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv\u003eUS: $96000 - $125000 (USD) + 0% bonus target\u003c/div\u003e\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv\u003eLearn more about \u003ca href\u003d\"https://www.google.com/about/careers/applications/benefits/\" target\u003d\"_blank\"\u003ebenefits at Google\u003c/a\u003e.\u003c/div\u003e\u003cp\u003e\u003cb\u003e\u003c/b\u003e\u003c/p\u003e"],[3],[1791816002,735000000],[1791877206,453000000],[1791877206,700000000],[null,"\u003cp\u003eParticipation in the internship program requires that you are located and have legal authorization to work in the United States for the duration of the internship program. For internship opportunities in the location where you are eligible for summer work authorization, please check google.com/students.\u003c/p\u003e\u003cp\u003ePlease note that applications for this program will be considered for multiple functions based across the United States. After the application period closes, we may reach out to collect additional information regarding your background and skills. You will then have the opportunity to state function preferences.\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003eApplication: Please complete your application by November 6, 2026\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eInterviews: Will occur on a rolling basis through Q1 2027\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eInternship: 12 consecutive weeks starting in May or June 2027\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eTo start the application process, you will need an updated resume in English (PDFs preferred). Click on the “Apply” button on this page and in the “Resume Section:” attach an updated CV or resume. Please ensure you’ve listed your anticipated graduation date (in MM/YY). \u003c/p\u003e\u003cp\u003eWe will review applications and interview candidates on a rolling basis through Q1 2027. Updates will be provided as the status of applications change in the recruiting process. Candidates will be matched with teams based on their background and skills.\u003c/p\u003e\u003cp\u003eApplicants in San Francisco: Qualified applications with arrest or conviction records will be considered for employment in accordance with the San Francisco Fair Chance Ordinance for Employers and the California Fair Chance Act.\u003c/p\u003e\u003cp\u003eIn accordance with Washington state law, we are highlighting our comprehensive benefits package, which is available to all eligible US based Interns. Benefits for this role include:\u003cbr\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eHealth, dental, vision insurance\u003c/li\u003e\u003cli\u003eSick Time: Includes 5 discretionary sick days per instance to prioritize your well-being, in addition to all applicable local and state statutory sick leave.\u003c/li\u003e\u003cli\u003eInterns receive paid time off for any official company holidays that fall within their internship term.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003c/p\u003e"],null,null,[null,"Note: By applying to this position you will have an opportunity to share your preferred working location from the following: \u003cb\u003eMountain View, CA, USA; Atlanta, GA, USA; Austin, TX, USA; Boulder, CO, USA; Chicago, IL, USA; Kirkland, WA, USA; New York, NY, USA; San Bruno, CA, USA; Seattle, WA, USA; San Francisco, CA, USA; Sunnyvale, CA, USA; Washington D.C., DC, USA\u003c/b\u003e."],[null,"\u003cul\u003e\n\u003cli\u003eCurrently enrolled in a full-time Master of Business Administration program.\u003c/li\u003e\n\u003c/ul\u003e"],5],["93402210922046150","Finance MBA Intern, 2027","https://www.google.com/about/careers/applications/signin?jobId\u003dCiUAL2FckZdQ1OCVLO7MP1kmoEAMrS0XzHkvGcvZ5em4ApFIQoqzEjsA9yzvguu3dwKqxuMcDVQxyHFq4f1AQXYNi2lXvWEKJlXOICkA7U7P9ynUKAlja96NR0G84PoGZdD-DA%3D%3D_V2\u0026loc\u003dIE\u0026title\u003dFinance+MBA+Intern",[null,"\u003cul\u003e\n\u003cli\u003eCollaborate with Product Management, Engineering, Sales, Operations, and Finance teams to identify, analyze, improve, and implement financial processes and systems.\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eDevelop and refine our budgeting and planning processes in partnership with team leaders.\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eAnalyze key performance and operational as well as financial metrics (e.g., business generation, productivity metrics, other key business drivers) and identify areas for improvements.\u003c/li\u003e\n\u003cli\u003eParticipate in discussions and develop analytical models to support company initiatives and/or financial decisions.\u003cbr\u003e\u003c/li\u003e\n\u003c/ul\u003e"],[null,"\u003ch3\u003eMinimum qualifications:\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003eCurrently enrolled in a MBA degree program in the EMEA region.\u003c/li\u003e\n\u003c/ul\u003e\u003cbr\u003e\u003ch3\u003ePreferred qualifications:\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003e4 years of experience prior to starting the MBA.\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eRelevant practical or internship experience demonstrating process engineering and analytical skills with an understanding of corporate finance concepts (e.g., credit risk, cash flow).\u003c/li\u003e\n\u003cli\u003eRelevant practical or internship experience demonstrating the ability to use critical thinking skills to solve highly strategic and difficult business problems.\u003c/li\u003e\n\u003cli\u003eRelevant practical or internship experience demonstrating project management, communication, and organisational skills, with the ability to drive and implement ideas in a changing environment.\u003c/li\u003e\n\u003cli\u003eCurrently in your penultimate/final year of education.\u003c/li\u003e\n\u003cli\u003eAbility to complete a minimum 13 week full-time internship in Ireland starting in either May, June or July 2027.\u003c/li\u003e\n\u003c/ul\u003e"],"projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc",null,"Google","en-US",[["Dublin, Ireland",["Barrow St, Dublin, Ireland"],"Dublin",null,"D","IE"]],[null,"\u003cp\u003eOur MBA Internship Program will immerse you into the tech industry on a high-impact team. You’ll enhance your skill set, be challenged with rigorous work, grow your network and drive meaningful change in our business. Outside of your core work, you will participate in a program that exposes you to Google’s business operations, connects you with interns and Googlers, and invests in your personal and professional development.\u003c/p\u003e\u003cdiv\u003eFinancial Operations (FinOps), Business Controller and Operations is responsible for almost all transactions at Google having to do with money on both, payables and receivables sides. Our systems have to be global, scalable, and ever-adapting to our new products and new regions we are entering. There are four major divisions within FinOps - Revenue to Cash Operations (RCO), Revenue Platforms (RP), Google Business Services (GBS), and Compass. As an MBA intern in any one of these teams, you will be working with large datasets and in a complex, global environment.\u003cbr\u003e\u003c/div\u003e\u003cp\u003eThe idea for Gmail began with 1 Googler. Today it has more than 1 billion users and counting.\u003cbr\u003e\u003cbr\u003eAt Google, one Googler can make a huge impact, and it’s no different with our interns--they are key players in our daily innovation. As an intern, you’ll have the opportunity to work on projects core to Google’s business, whether it be Sales, Enterprise, Finance, People Operations (HR), Legal, Trust and Safety, or Marketing. Our intern recruitment team will determine where you fit best based on your CV and the preferences you indicate on the application form.\u003c/p\u003e\u003cp\u003eIndividual pay is determined by factors including job-related skills, experience, and relevant education or training.\u003c/p\u003e\u003cp\u003eIreland: €72000 (EUR) + 0% bonus target\u003c/p\u003e\u003cp\u003eLearn more about \u003ca href\u003d\"https://www.google.com/about/careers/applications/benefits/\" target\u003d\"_blank\"\u003ebenefits at Google\u003c/a\u003e.\u003c/p\u003e"],[3],[1790946563,56000000],[1791205800,994000000],[1791205801,80000000],[null,"\u003cp\u003ePlease complete your application before \u003cb\u003eNovember 13, 2026\u003c/b\u003e. We encourage you to apply as early as possible as we review applications on a rolling basis.\u003c/p\u003e\u003cdiv\u003eThis internship is intended for students enrolled in their penultimate/final year of education in an accredited MBA degree program located in the EMEA region. Participation in the internship program requires that you are located in Ireland for the duration of the internship program. Interns will be required to be available to work full-time for a minimum of 13 weeks over the Summer 2027 (starting in May, June or July) for the duration of the program. Individuals applying for this position will not be eligible for immigration sponsorship.\u003cbr\u003e\u003cbr\u003eTiming on when you can hear back will vary and can take upwards of 90+ days. If you haven’t heard from us in three months about an application, we likely proceeded with other candidates for that particular role. However, our recruiters might reach out if we find a different potential match for your skills, interests, and experience.\u003c/div\u003e\u003cdiv\u003e\u003cbr\u003eTo start the application process, you will need an updated CV or resume and a current unofficial or official transcript in English. Click on the “Apply” button on this page and provide the required materials in the appropriate sections (PDFs preferred):\u003cbr\u003e\u003col\u003e\u003cli\u003eIn the “Resume Section:” attach an updated CV or resume\u003c/li\u003e\u003cli\u003eIn the “Education Section:” attach a current or recent unofficial or official transcript in English.\u003c/li\u003e\u003cli\u003eUnder “Degree Status,” select “Now attending” to upload a transcript.\u003c/li\u003e\u003c/ol\u003ePlease include your expected graduation date (month and year), and availability for the internship on your resume. The specific team and project(s) will be determined based on your educational background, interest and skills.\u003c/div\u003e"],null,null,[null,""],[null,"\u003cul\u003e\n\u003cli\u003eCurrently enrolled in a MBA degree program in the EMEA region.\u003c/li\u003e\n\u003c/ul\u003e"],5]]</script></body></html>
