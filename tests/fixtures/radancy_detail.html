<html><body><script type="application/ld+json">{"@type": "JobPosting", "description": "<p dir='ltr' style='line-height:1.3800000000000001;text-align: justify;margin-top:0pt;margin-bottom:0pt;' data-pasted='true'><span style='font-size: 11pt; font-family: arial; color: rgb(0, 0, 0);  font-weight: 600; font-style: italic; font-variant: normal; text-decoration: none; vertical-align: baseline; white-space: pre-wrap;'>To qualify for US internships, you must be currently enrolled in a degree-seeking program with an expected graduation date after the internship/co-op ends. If you do not meet this requirement, we invite you to explore other opportunities available on our careers website.</span></p><p><span style='font-family: arial;'><br></span></p><p dir='ltr' style='line-height:1.3800000000000001;text-align: justify;margin-top:0pt;margin-bottom:0pt;'><span style='font-size: 11pt; font-family: arial; color: rgb(0, 0, 0);  font-weight: 400; font-style: normal; font-variant: normal; text-decoration: none; vertical-align: baseline; white-space: pre-wrap;'>Intuit internships are 12 weeks throughout the summer. We have fixed start and end dates that are designed to work with various universities’ academic calendars.</span></p><ul style='margin-top:0;margin-bottom:0;padding-inline-start:48px;'><li dir='ltr' style='list-style-type: disc; font-size: 11pt; font-family: arial; color: rgb(0, 0, 0);  font-weight: 600; font-style: italic; font-variant: normal; text-decoration: none; vertical-align: baseline; white-space: pre;'><p dir='ltr' style='line-height:1.3800000000000001;text-align: justify;margin-top:0pt;margin-bottom:0pt;' role='presentation'><span style='font-size: 11pt; color: rgb(0, 0, 0);  font-weight: 600; font-style: italic; font-variant: normal; text-decoration: none; vertical-align: baseline; white-space: pre-wrap;'>Cohort 1: Monday, May 17 - Friday, August 6, 2027 (12 weeks)</span></p></li><li dir='ltr' style='list-style-type: disc; font-size: 11pt; font-family: arial; color: rgb(0, 0, 0);  font-weight: 600; font-style: italic; font-variant: normal; text-decoration: none; vertical-align: baseline; white-space: pre;'><p dir='ltr' style='line-height:1.3800000000000001;text-align: justify;margin-top:0pt;margin-bottom:0pt;' role='presentation'><span style='font-size: 11pt; color: rgb(0, 0, 0);  font-weight: 600; font-style: italic; font-variant: normal; text-decoration: none; vertical-align: baseline; white-space: pre-wrap;'>Cohort 2: Monday, June 14 - Friday September 3, 2027 (12 weeks)</span></p></li></ul><p><span style='font-family: arial;'><br></span></p><p dir='ltr' style='line-height:1.3800000000000001;text-align: justify;margin-top:0pt;margin-bottom:0pt;padding:0pt 0pt 7pt 0pt;'><span style='font-size: 11pt; font-family: arial; color: rgb(0, 0, 0);  font-weight: 700; font-style: normal; font-variant: normal; text-decoration: none; vertical-align: baseline; white-space: pre-wrap;'>About our Emerging Talent Program:&nbsp;</span></p><p dir='ltr' style='line-height:1.3800000000000001;text-align: justify;margin-top:0pt;margin-bottom:0pt;'><span style='font-size: 11pt; font-family: arial; color: rgb(0, 0, 0);  font-weight: 400; font-style: normal; font-variant: normal; text-decoration: none; vertical-align: baseline; white-space: pre-wrap;'>Intuit invests in Emerging Talent because fresh perspectives strengthen our products and teams. The program is backed by a culture that values curiosity and collaboration, and you'll be supported by dedicated managers and mentors who are invested in your growth. As an intern or co-op, you'll work on meaningful projects with business impact, many centered on AI and emerging technologies, and contribute to driving &nbsp;decisions. You'll build skills through function-specific learning opportunities, connect with a global community of interns and co-ops through dedicated programming and social events, and get exposure to senior leadership and cross-functional work across Intuit's product ecosystem. Learn more about our Intern and Co-op Program&nbsp;</span><span style='font-family: arial;'><a href='https://www.intuit.com/careers/programs/internships/' style='font-family: arial;'><span style='font-size: 11pt; color: rgb(35, 108, 255);  font-weight: 400; font-style: normal; font-variant: normal; text-decoration: underline; text-decoration-skip-ink: none; vertical-align: baseline; white-space: pre-wrap;'>here</span></a></span><span style='font-size: 11pt; font-family: arial; color: rgb(0, 0, 0);  font-weight: 400; font-style: normal; font-variant: normal; text-decoration: none; vertical-align: baseline; white-space: pre-wrap;'>.</span></p><p dir='ltr' style='line-height:1.3800000000000001;text-align: justify;margin-top:0pt;margin-bottom:0pt;'><span style='font-family: arial;'><br></span></p><p dir='ltr' style='line-height:1.3800000000000001;text-align: justify;margin-top:0pt;margin-bottom:0pt;'><span style='font-size: 11pt; font-family: arial; color: rgb(0, 0, 0);  font-weight: 400; font-style: normal; font-variant: normal; text-decoration: none; vertical-align: baseline; white-space: pre-wrap;'><strong>About the Team</strong></span><span style='font-family: arial;'><br></span></p><p dir='ltr' style='line-height: 1.38; margin-top: 12pt; margin-bottom: 12pt;'><span style='font-size: 10pt; font-family: arial; color: rgb(0, 0, 0); font-weight: 400; font-style: normal; font-variant: normal; text-decoration: none; vertical-align: baseline; white-space: pre-wrap;'>Join Intuit’s Corporate Strategy and Development team as an MBA Intern for Summer 2027. This is a 10–12 week hybrid internship, beginning in May or June 2026, based in our Mountain View office with three days per week onsite.</span></p><p dir='ltr' style='line-height: 1.38; margin-top: 12pt; margin-bottom: 12pt;'><span style='font-size: 10pt; font-family: arial; color: rgb(0, 0, 0); font-weight: 400; font-style: normal; font-variant: normal; text-decoration: none; vertical-align: baseline; white-space: pre-wrap;'>As a Corporate Strategy MBA intern, you will contribute to high-impact projects that shape Intuit’s growth strategy at both the company-wide and business unit levels. You’ll work closely with members of the CS&amp;D on a project team of 3-5 to identify and evaluate new growth opportunities, applying your strategic and analytical skills to structure rigorous analysis, generate insights, and support recommendations that inform key business decisions.</span></p><p dir='ltr' style='line-height: 1.38; margin-top: 12pt; margin-bottom: 12pt;'><span style='font-size: 10pt; font-family: arial; color: rgb(0, 0, 0); font-weight: 400; font-style: normal; font-variant: normal; text-decoration: none; vertical-align: baseline; white-space: pre-wrap;'>Throughout the internship, you will have the opportunity to work on projects that address some of Intuit’s most important strategic priorities. Recent examples include developing product strategies for new offerings, proposing transformational strategic partnerships with other tech companies, shaping our mobile app strategy to drive customer engagement and acquisition, and identifying opportunities to unlock international growth. Along the way, you’ll gain exposure to senior leaders, receive mentorship from experienced leaders, and build a toolkit of skills that will accelerate your career. Interns are expected to bring curiosity, problem-solving skills, and a collaborative mindset as trusted members of the team.</span></p><p dir='ltr' style='line-height: 1.38; margin-top: 12pt; margin-bottom: 12pt;'><span style='font-size: 10pt; font-family: arial; color: rgb(0, 0, 0); font-weight: 400; font-style: normal; font-variant: normal; text-decoration: none; vertical-align: baseline; white-space: pre-wrap;'>This MBA Internship offers excellent opportunities to:</span></p><ul style='margin-top: 0; margin-bottom: 0; padding-inline-start: 48px;'><li dir='ltr' style='list-style-type: disc; font-size: 10pt; font-family: arial; color: rgb(0, 0, 0); font-weight: 400; font-style: normal; font-variant: normal; text-decoration: none; vertical-align: baseline; white-space: pre;'><p dir='ltr' style='line-height: 1.38; margin-top: 12pt; margin-bottom: 0pt;' role='presentation'><span style='font-size: 10pt; color: rgb(0, 0, 0); font-weight: 400; font-style: normal; font-variant: normal; text-decoration: none; vertical-align: baseline; white-space: pre-wrap;'>Contribute to high-impact projects that shape company-level strategy and provide visibility to senior leaders</span></p></li><li dir='ltr' style='list-style-type: disc; font-size: 10pt; font-family: arial; color: rgb(0, 0, 0); font-weight: 400; font-style: normal; font-variant: normal; text-decoration: none; vertical-align: baseline; white-space: pre;'><p dir='ltr' style='line-height: 1.38; margin-top: 0pt; margin-bottom: 0pt;' role='presentation'><span style='font-size: 10pt; color: rgb(0, 0, 0); font-weight: 400; font-style: normal; font-variant: normal; text-decoration: none; vertical-align: baseline; white-space: pre-wrap;'>Learn from a team recognized as a source of future leaders and develop a strong foundation for a career in strategy and related roles</span></p></li><li dir='ltr' style='list-style-type: disc; font-size: 10pt; font-family: arial; color: rgb(0, 0, 0); font-weight: 400; font-style: normal; font-variant: normal; text-decoration: none; vertical-align: baseline; white-space: pre;'><p dir='ltr' style='line-height: 1.38; margin-top: 0pt; margin-bottom: 0pt;' role='presentation'><span style='font-size: 10pt; color: rgb(0, 0, 0); font-weight: 400; font-style: normal; font-variant: normal; text-decoration: none; vertical-align: baseline; white-space: pre-wrap;'>Build expertise across Intuit’s diverse businesses and functions</span></p></li><li dir='ltr' style='list-style-type: disc; font-size: 10pt; font-family: arial; color: rgb(0, 0, 0); font-weight: 400; font-style: normal; font-variant: normal; text-decoration: none; vertical-align: baseline; white-space: pre;'><p dir='ltr' style='line-height: 1.38; margin-top: 0pt; margin-bottom: 12pt;' role='presentation'><span style='font-size: 10pt; color: rgb(0, 0, 0); font-weight: 400; font-style: normal; font-variant: normal; text-decoration: none; vertical-align: baseline; white-space: pre-wrap;'>We are looking to bring highly talented people into the organization, and our summer internships serve as a key pipeline for full-time opportunities following MBA graduation</span></p></li></ul><br><p class='Responsibilities'><strong>Responsibilities</strong></p><ul style='margin-top: 0px; margin-bottom: 0px; padding-inline-start: 48px;'><li dir='ltr' style='list-style-type: disc; font-size: 11pt; font-family: Arial, sans-serif; font-variant: normal; vertical-align: baseline; white-space: pre;'><p dir='ltr' style='line-height: 1.38; margin-top: 12pt; margin-bottom: 0pt;' role='presentation'><span style='font-size: 10pt; font-variant: normal; vertical-align: baseline; white-space: pre-wrap;'>Collaborate with project teams and business partners on structured problem-solving to address high-priority strategic questions</span></p></li><li dir='ltr' style='list-style-type: disc; font-size: 11pt; font-family: Arial, sans-serif; font-variant: normal; vertical-align: baseline; white-space: pre;'><p dir='ltr' style='line-height: 1.38; margin-top: 0pt; margin-bottom: 0pt;' role='presentation'><span style='font-size: 10pt; font-variant: normal; vertical-align: baseline; white-space: pre-wrap;'>Support research and analysis, including customer and expert interviews, market assessments, and both quantitative and qualitative analysis</span></p></li><li dir='ltr' style='list-style-type: disc; font-size: 11pt; font-family: Arial, sans-serif; font-variant: normal; vertical-align: baseline; white-space: pre;'><p dir='ltr' style='line-height: 1.38; margin-top: 0pt; margin-bottom: 12pt;' role='presentation'><span style='font-size: 10pt; font-variant: normal; vertical-align: baseline; white-space: pre-wrap;'>Assist in creating and delivering clear, compelling narratives and presentations that communicate findings and recommendations to project leaders and senior stakeholders</span></p></li></ul><br><p class='Qualifications'><strong>Qualifications</strong></p><ul style='margin-top: 0px; margin-bottom: 0px; padding-inline-start: 48px;'><li dir='ltr' style='list-style-type: disc; font-size: 10pt; font-family: Arial, sans-serif; font-variant: normal; vertical-align: baseline; white-space: pre;'><p dir='ltr' style='line-height: 1.38; margin-top: 12pt; margin-bottom: 0pt;' role='presentation'><span style='font-size: 10pt; font-variant: normal; vertical-align: baseline; white-space: pre-wrap;'>Must be enrolled in an MBA program graduating in May/June 2028 and returning to complete your second year following the internship</span></p></li><li dir='ltr' style='list-style-type: disc; font-size: 10pt; font-family: Arial, sans-serif; font-variant: normal; vertical-align: baseline; white-space: pre;'><p dir='ltr' style='line-height: 1.38; margin-top: 0pt; margin-bottom: 0pt;' role='presentation'><span style='font-size: 10pt; font-variant: normal; vertical-align: baseline; white-space: pre-wrap;'>4+ years of work experience prior to starting your MBA</span></p></li><li dir='ltr' style='list-style-type: disc; font-size: 10pt; font-family: Arial, sans-serif; font-variant: normal; vertical-align: baseline; white-space: pre;'><p dir='ltr' style='line-height: 1.38; margin-top: 0pt; margin-bottom: 0pt;' role='presentation'><span style='font-size: 10pt; font-variant: normal; vertical-align: baseline; white-space: pre-wrap;'>Prior experience in a top-tier strategy consulting firm or in the corporate strategy/business operations function of a leading company preferred</span></p></li><li dir='ltr' style='list-style-type: disc; font-size: 10pt; font-family: Arial, sans-serif; font-variant: normal; vertical-align: baseline; white-space: pre;'><p dir='ltr' style='line-height: 1.38; margin-top: 0pt; margin-bottom: 0pt;' role='presentation'><span style='font-size: 10pt; font-variant: normal; vertical-align: baseline; white-space: pre-wrap;'>Strong quantitative and analytical skills, creativity in problem solving, and sound business judgment</span></p></li><li dir='ltr' style='list-style-type: disc; font-size: 10pt; font-family: Arial, sans-serif; font-variant: normal; vertical-align: baseline; white-space: pre;'><p dir='ltr' style='line-height: 1.38; margin-top: 0pt; margin-bottom: 0pt;' role='presentation'><span style='font-size: 10pt; font-variant: normal; vertical-align: baseline; white-space: pre-wrap;'>Excellent communication (written and verbal), presentation, and facilitation skills</span></p></li><li dir='ltr' style='list-style-type: disc; font-size: 10pt; font-family: Arial, sans-serif; font-variant: normal; vertical-align: baseline; white-space: pre;'><p dir='ltr' style='line-height: 1.38; margin-top: 0pt; margin-bottom: 0pt;' role='presentation'><span style='font-size: 10pt; font-variant: normal; vertical-align: baseline; white-space: pre-wrap;'>Strong interpersonal skills with the ability to build relationships and collaborate effectively within a team</span></p></li><li dir='ltr' style='list-style-type: disc; font-size: 10pt; font-family: Arial, sans-serif; font-variant: normal; vertical-align: baseline; white-space: pre;'><p dir='ltr' style='line-height: 1.38; margin-top: 0pt; margin-bottom: 0pt;' role='presentation'><span style='font-size: 10pt; font-variant: normal; vertical-align: baseline; white-space: pre-wrap;'>Open to developmental feedback, eager to learn, and motivated to make a meaningful impact</span></p></li><li dir='ltr' style='list-style-type: disc; font-size: 10pt; font-family: Arial, sans-serif; font-variant: normal; vertical-align: baseline; white-space: pre;'><p dir='ltr' style='line-height: 1.38; margin-top: 0pt; margin-bottom: 12pt;' role='presentation'><span style='font-size: 10pt; font-variant: normal; vertical-align: baseline; white-space: pre-wrap;'>Self-directed with a strong sense of ownership and accountability</span></p></li></ul><br><p style='margin: 0px;color: rgb(34, 34, 34);font-family: Arial, Helvetica, sans-serif;font-size: small;font-style: normal;font-weight: 400;text-align: start;text-indent: 0px;text-transform: none;' data-pasted='true'><span style='font-size:11pt;font-family:Avenir,sans-serif;color:#000000;font-weight:400;font-style:normal;font-variant:normal;text-decoration:none;vertical-align:baseline;white-space:pre;white-space:pre-wrap;' data-pasted='true'>Intuit provides a competitive compensation package with a strong pay for performance rewards approach. Pay offered is based on factors such as job-related knowledge, skills, experience, and work location. To drive ongoing fair pay for employees, Intuit conducts regular comparisons across categories of ethnicity and gender.&nbsp;<span data-pasted='true' style='box-sizing: inherit; -webkit-tap-highlight-color: transparent; font-family: Avenir, sans-serif; font-size: 11pt; color: rgb(0, 0, 0); font-style: normal; font-variant: normal; font-weight: 400; letter-spacing: normal; orphans: 2; text-align: start; text-indent: 0px; text-transform: none; widows: 2; word-spacing: 0px; -webkit-text-stroke-width: 0px; white-space: pre-wrap; text-decoration: none; vertical-align: baseline;'>The expected base pay range for this position is: $52 - 65</span><span style='box-sizing: inherit; -webkit-tap-highlight-color: transparent; font-family: Avenir, sans-serif; font-size: 11pt; color: rgb(0, 0, 0); font-style: normal; font-variant: normal; font-weight: 400; letter-spacing: normal; orphans: 2; text-align: start; text-indent: 0px; text-transform: none; widows: 2; word-spacing: 0px; -webkit-text-stroke-width: 0px; white-space: pre-wrap; text-decoration: none; vertical-align: baseline;'>/hr in MTV.</span></span></p><p style='outline: 0px; margin: 0px 0px 0.6em; padding: 0px; border: 0px; color: rgb(118, 118, 118);'><br style='outline: 0px; margin: 0px;'></p><p style='outline: 0px; margin: 0px 0px 0.6em; padding: 0px; border: 0px; color: rgb(118, 118, 118);'><br style='outline: 0px; margin: 0px; color: rgb(118, 118, 118); font-family: sans-serif; font-size: 14px; font-style: normal; font-variant-ligatures: normal; font-variant-caps: normal; font-weight: 400; letter-spacing: normal; orphans: 2; text-align: left; text-indent: 0px; text-transform: none; widows: 2; word-spacing: 0px; -webkit-text-stroke-width: 0px; white-space: normal;  text-decoration-thickness: initial; text-decoration-style: initial; text-decoration-color: initial;'></p> The expected base pay range for this position is: <br> Mountain View $37.5 - $68 <br>"}</script></body></html>
